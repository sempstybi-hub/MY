<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Программы</title>
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"> 
    <link type="text/css" rel="stylesheet" href="css/materialize.css"  media="screen,projection"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        @font-face {
            font-family: 'MyFont';
            src: url('moscowsansregular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        html {
            font-family: 'MyFont', sans-serif;
        }
        body {
            background-color: #0B0F2A;
        }
        .nav-wrapper {
            background-color: #FFBF00;
            color: #0B0F2A;
        }
    </style>
</head>
<body>
    <div class="navbar-fixed">
        <nav>
            <div class="nav-wrapper">
                <a href="index.html" class="brand-logo my1-text" style="padding-left: 15px;">Gray_FAR</a>
                <ul class="right hide-on-med-and-down">
                    <li><a href="index.html" class="my1-text">Главная</a></li>
                    <li><a href="prog.html" class="my1-text">Программы</a></li>
                    <li><a href="game.html" class="my1-text">Игры</a></li>
                </ul>
            </div>
        </nav>
    </div>

    <div class="container" style="margin-top: 30px;">
        <h1 class="my2-text">Программы</h1>

        <!-- Прелоадер (показывается пока грузится JSON) -->
        <div id="preloader" class="center-align" style="margin: 40px 0;">
            <div class="preloader-wrapper active">
                <div class="spinner-layer spinner-yellow-only">
                    <div class="circle-clipper left"><div class="circle"></div></div>
                    <div class="gap-patch"><div class="circle"></div></div>
                    <div class="circle-clipper right"><div class="circle"></div></div>
                </div>
            </div>
        </div>

        <!-- Контейнер, куда будут вставляться карточки -->
        <div id="programs-list" class="row"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <script src="js/materialize.min.js"></script>
    <script>
        // === Загрузка и отрисовка программ ===
        async function loadPrograms() {
            const list = document.getElementById('programs-list');
            const preloader = document.getElementById('preloader');

            try {
                // Загружаем JSON (cache: 'no-store' — чтобы всегда брал свежую версию)
                const response = await fetch('programs.json', { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                const programs = data.programs || [];

                preloader.style.display = 'none';

                if (programs.length === 0) {
                    list.innerHTML = `<div class="col s12"><p>Пока нет программ 😕</p></div>`;
                    return;
                }

                // Генерируем карточки
                list.innerHTML = programs.map(prog => `
                    <div class="col s12 m6 l4">
                        <div class="program-card">
                            <div class="card-image">
                                <img src="${prog.banner}" alt="${prog.name}"
                                     onerror="this.src='https://via.placeholder.com/400x180?text=No+Image'">
                                <span class="version-badge">v${prog.version}</span>
                            </div>
                            <div class="card-content">
                                <div class="card-title">${prog.name}</div>
                                <div class="meta">
                                    <span><i class="material-icons">storage</i> ${prog.size}</span>
                                    <span><i class="material-icons">tag</i> ID: ${prog.id}</span>
                                </div>
                                <p>${prog.info}</p>
                            </div>
                            <div class="card-action">
                                <a href="${prog.download_url}" target="_blank" rel="noopener">
                                    <i class="material-icons left">download</i>Скачать
                                </a>
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                console.error('Ошибка загрузки программ:', err);
                preloader.style.display = 'none';
                list.innerHTML = `
                    <div class="col s12">
                        <div class="error-box">
                            <b>Не удалось загрузить программы</b><br>
                            ${err.message}<br><br>
                            <small>Проверь, что файл <code>programs.json</code> лежит рядом с HTML,
                            и что страница открыта через сервер (http://), а не как file://</small>
                        </div>
                    </div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadPrograms);
    </script>
</body>
</html>
